server {
    listen 80;
    server_name localhost;
    
    # ==============================================
    # UPLOAD DIRECTO A NGINX (SIN PASAR POR .NET)
    # Máximo ahorro de recursos
    # ==============================================
    location /upload {
        # Directorio temporal para uploads
        client_body_temp_path /var/www/media/temp/uploads 1 2;
        
        # Configuración específica para uploads
        client_max_body_size 500M;        # Máximo archivo: 500MB
        client_body_timeout 300s;         # 5 minutos para upload completo
        client_body_buffer_size 128k;     # Buffer inicial en RAM
        
        # Si excede 128k, va directo a disco (ahorra RAM)
        client_body_in_file_only clean;   # Siempre escribe a archivo temporal
        
        # Headers para upload progressivo
        proxy_request_buffering off;      # No buffer completo antes de enviar
        proxy_max_temp_file_size 0;       # Sin límite archivo temporal
        
        # Después del upload físico, notificar a .NET para metadata
        proxy_pass http://127.0.0.1:5000/api/upload;
        proxy_http_version 1.1;
        
        # Headers críticos para .NET sepa dónde está el archivo
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-File-Path $request_body_file;  # Ruta del archivo temporal
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
    }
    
    # ==============================================
    # ENDPOINT ESPECÍFICO PARA DIFERENTES TIPOS
    # Validación básica por extensión antes de upload
    # ==============================================
    
    # Upload de imágenes para posts/cursos
    location /upload/images {
        # Solo permitir tipos específicos
        if ($request_filename !~* \.(jpg|jpeg|png|gif|webp)$) {
            return 415;  # Unsupported Media Type
        }
        
        client_body_temp_path /var/www/media/temp/uploads/images;
        client_max_body_size 20M;         # Imágenes: máximo 20MB
        client_body_timeout 60s;          # 1 minuto suficiente
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/images;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "image";
    }
    
    # Upload de videos para contenido educativo
    location /upload/videos {
        if ($request_filename !~* \.(mp4|webm|avi|mov)$) {
            return 415;
        }
        
        client_body_temp_path /var/www/media/temp/uploads/videos;
        client_max_body_size 500M;        # Videos: hasta 500MB
        client_body_timeout 600s;         # 10 minutos para videos grandes
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/videos;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "video";
    }
    
    # Upload de audio para podcasts/música
    location /upload/audio {
        if ($request_filename !~* \.(mp3|ogg|wav|flac|aac)$) {
            return 415;
        }
        
        client_body_temp_path /var/www/media/temp/uploads/audio;
        client_max_body_size 100M;        # Audio: máximo 100MB
        client_body_timeout 180s;         # 3 minutos
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/audio;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "audio";
    }
    
    # ==============================================
    # CLEANUP AUTOMÁTICO DE ARCHIVOS TEMPORALES
    # Evita acumulación de basura en disco
    # ==============================================
    location /cleanup {
        # Solo accesible internamente o por cron
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://127.0.0.1:5000/api/cleanup;
    }
    
    # [El resto de configuraciones multimedia del paso anterior se mantienen]
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        root /var/www/media;
        try_files $uri =404;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    
    location ~* \.(mp4|webm|avi|mov)$ {
        root /var/www/media;
        try_files $uri =404;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        add_header Accept-Ranges bytes;
        expires 3d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        output_buffers 2 1m;
        postpone_output 1460;
    }
    
    location ~* \.(mp3|ogg|wav|flac|aac)$ {
        root /var/www/media;
        try_files $uri =404;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes;
        expires 5d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # API general (autenticación, CRUD, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }
}