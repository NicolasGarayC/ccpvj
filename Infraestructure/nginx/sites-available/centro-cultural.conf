server {
    listen 80;
    server_name localhost;
    
    # ==============================================
    # CACHE Y RATE LIMITING GLOBAL
    # ==============================================
    
    # Rate limiting para API
    limit_req zone=api_limit burst=20 nodelay;
    
    # ==============================================
    # ARCHIVOS MULTIMEDIA - SERVICIO DIRECTO
    # Sin autenticación, máximo rendimiento
    # ==============================================
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        root /home/user/ccpvj/Data/media;
        try_files $uri =404;
        
        # Optimización para imágenes
        sendfile on;           # Transferencia kernel-level (menos CPU)
        tcp_nopush on;         # Envía headers + archivo juntos
        tcp_nodelay on;        # No delay en paquetes pequeños
        
        # Cache headers inteligentes (actualizado)
        expires 30d;                              # Cache por 30 días
        add_header Cache-Control "public, immutable, no-transform";
        add_header Vary "Accept-Encoding";        # Para diferentes compresiones
        
        # ETag para validación eficiente
        etag on;
        if_modified_since exact;                  # Validar modificaciones exactas
        
        # CORS para acceso desde cualquier origen
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        
        # Compresión solo para SVG (texto)
        location ~* \.svg$ {
            gzip_static on;                       # Buscar .svg.gz pre-comprimido
        }
    }
    
    # Videos - Configuración especial para streaming
    location ~* \.(mp4|webm|avi|mov)$ {
        root /home/user/ccpvj/Data/media;
        try_files $uri =404;
        
        # Streaming optimizado
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # CRÍTICO: Range requests para seek en videos
        # Permite reproducir sin descargar completo
        add_header Accept-Ranges bytes;
        
        # Cache headers para videos (actualizado)
        expires 7d;                               # Cache más corto (archivos grandes)
        add_header Cache-Control "public, max-age=604800";
        etag on;
        
        # Headers específicos para video streaming
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range";
        
        # Buffer más grande para archivos multimedia (actualizado)
        output_buffers 4 64k;                     # Más buffers para video
        postpone_output 1460;  # Tamaño MTU típico
        
        # Rate limiting suave para videos (evitar saturación)
        limit_req zone=api_limit burst=10 nodelay;
    }
    
    # Audio - Similar a video pero con menos buffer
    location ~* \.(mp3|ogg|wav|flac|aac)$ {
        root /home/user/ccpvj/Data/media;
        try_files $uri =404;
        
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes;  # Seek en audio
        
        # Cache intermedio (actualizado)
        expires 14d;                              # Cache intermedio
        add_header Cache-Control "public, max-age=1209600";
        etag on;
        add_header Access-Control-Allow-Origin "*";
        
        # Buffers menores para audio
        output_buffers 2 32k;
    }
    
    # ==============================================
    # UPLOAD DIRECTO A NGINX (SIN PASAR POR .NET)
    # Máximo ahorro de recursos
    # ==============================================
    location /upload {
        # Rate limiting muy estricto para uploads
        limit_req zone=upload_limit burst=2 nodelay;  # Máximo 5 uploads/min
        
        # Directorio temporal para uploads
        client_body_temp_path /home/user/ccpvj/Data/media/temp/uploads 1 2;

        # Configuración específica para uploads
        client_max_body_size 20G;         # Máximo archivo: 20GB
        client_body_timeout 3600s;        # 1 hora para upload completo
        client_body_buffer_size 128k;     # Buffer inicial en RAM
        
        # Si excede 128k, va directo a disco (ahorra RAM)
        client_body_in_file_only clean;   # Siempre escribe a archivo temporal
        
        # Headers para upload progressivo
        proxy_request_buffering off;      # No buffer completo antes de enviar
        proxy_max_temp_file_size 0;       # Sin límite archivo temporal
        
        # Después del upload físico, notificar a .NET para metadata
        proxy_pass http://127.0.0.1:5000/api/upload;
        proxy_http_version 1.1;
        
        # Headers críticos para .NET sepa dónde está el archivo
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-File-Path $request_body_file;  # Ruta del archivo temporal
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
    }
    
    # ==============================================
    # ENDPOINT ESPECÍFICO PARA DIFERENTES TIPOS
    # Validación básica por extensión antes de upload
    # ==============================================
    
    # Upload de imágenes para posts/cursos
    location /upload/images {
        # Rate limiting específico
        limit_req zone=upload_limit burst=3 nodelay;

        # Solo permitir tipos específicos
        if ($request_filename !~* \.(jpg|jpeg|png|gif|webp)$) {
            return 415;  # Unsupported Media Type
        }

        client_body_temp_path /home/user/ccpvj/Data/media/temp/uploads/images;
        client_max_body_size 1G;          # Imágenes: máximo 1GB
        client_body_timeout 300s;         # 5 minutos
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/images;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "image";
    }
    
    # Upload de videos para contenido educativo
    location /upload/videos {
        # Rate limiting muy estricto para videos
        limit_req zone=upload_limit burst=1 nodelay;

        if ($request_filename !~* \.(mp4|webm|avi|mov)$) {
            return 415;
        }

        client_body_temp_path /home/user/ccpvj/Data/media/temp/uploads/videos;
        client_max_body_size 20G;         # Videos: hasta 20GB
        client_body_timeout 3600s;        # 1 hora para videos grandes
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/videos;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "video";
    }
    
    # Upload de audio para podcasts/música
    location /upload/audio {
        limit_req zone=upload_limit burst=2 nodelay;

        if ($request_filename !~* \.(mp3|ogg|wav|flac|aac)$) {
            return 415;
        }

        client_body_temp_path /home/user/ccpvj/Data/media/temp/uploads/audio;
        client_max_body_size 20G;         # Audio: máximo 20GB
        client_body_timeout 3600s;        # 1 hora para archivos grandes
        
        client_body_in_file_only clean;
        proxy_request_buffering off;
        
        proxy_pass http://127.0.0.1:5000/api/upload/audio;
        proxy_set_header X-File-Path $request_body_file;
        proxy_set_header X-Upload-Type "audio";
    }
    
    # ==============================================
    # CLEANUP AUTOMÁTICO DE ARCHIVOS TEMPORALES
    # Evita acumulación de basura en disco
    # ==============================================
    location /cleanup {
        # Solo accesible internamente o por cron
        allow 127.0.0.1;
        deny all;
        
        proxy_pass http://127.0.0.1:5000/api/cleanup;
    }
    
    # ==============================================
    # API Y AUTENTICACIÓN - VÍA BACKEND
    # Aquí sí necesitamos autenticación
    # ==============================================
    location /api/ {
        # CORS Headers - Permitir cualquier origen
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Manejar peticiones OPTIONS (preflight CORS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:5251;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers para mantener contexto del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración para requests normales de API
        client_max_body_size 10M;         # Para datos JSON/forms pequeños
        client_body_timeout 30s;          # Timeout corto para API

        # Timeouts del proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache para respuestas GET que no cambien frecuentemente
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5m;                # Cachear 200 OK por 5min
        proxy_cache_valid 404 1m;                # Cachear 404 por 1min
    }
    
    # Frontend SPA - DEV MODE (proxy to SvelteKit dev server)
    # For production, replace this with static file serving
    location / {
        # Proxy to SvelteKit development server for hot reloading
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Support WebSocket for hot reloading
        proxy_set_header Connection "upgrade";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}