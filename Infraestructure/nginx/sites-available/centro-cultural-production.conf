server {
    listen 80;
    server_name localhost;

    # ==============================================
    # ARCHIVOS MULTIMEDIA - SERVICIO DIRECTO
    # Sin autenticación, máximo rendimiento
    # ==============================================
    location ~* \.(jpg|jpeg|png|gif|webp|svg|mp4|webm|avi|mov|mp3|ogg|wav|flac|aac)$ {
        root /home/user/ccpvj/Data/media;
        try_files $uri =404;

        # Optimización
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Cache headers
        expires 30d;
        add_header Cache-Control "public, immutable";

        # CORS para multimedia
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        # Range requests para videos/audio
        add_header Accept-Ranges bytes;
    }

    # ==============================================
    # API Y AUTENTICACIÓN - VÍA BACKEND
    # CORS configurado aquí
    # ==============================================
    location /api/ {
        # CORS Headers - Permitir cualquier origen
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Manejar peticiones OPTIONS (preflight CORS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept,Origin' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_pass http://127.0.0.1:5251;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers para mantener contexto del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración para requests normales de API
        client_max_body_size 500M;
        client_body_timeout 300s;

        # Timeouts del proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==============================================
    # UPLOAD ENDPOINTS
    # ==============================================
    location /upload/ {
        client_max_body_size 5G;
        client_body_timeout 3600s;

        proxy_pass http://127.0.0.1:5251;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    # ==============================================
    # FRONTEND SPA - PRODUCTION MODE (Puerto 3000)
    # ==============================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
