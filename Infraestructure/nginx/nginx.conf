# Configuración global optimizada para multimedia
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    use epoll;                    # Linux: más eficiente que select
    multi_accept on;              # Acepta múltiples conexiones por evento
    accept_mutex off;             # Mejor para pocos workers
}

http {
    # ==============================================
    # TIPOS MIME Y CONFIGURACIÓN BÁSICA
    # ==============================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # ==============================================
    # CACHE DE ARCHIVOS DEL SISTEMA OPERATIVO
    # Reducción masiva de llamadas al sistema
    # ==============================================
    open_file_cache max=10000 inactive=5m;    # 10k archivos en cache por 5min
    open_file_cache_valid 2m;                 # Revalidar cada 2min
    open_file_cache_min_uses 2;               # Mínimo 2 accesos para cachear
    open_file_cache_errors on;                # Cachear también errores 404
    
    # ==============================================
    # COMPRESIÓN INTELIGENTE
    # Solo texto, nunca multimedia (ya comprimido)
    # ==============================================
    gzip on;
    gzip_vary on;                 # Header Vary: Accept-Encoding
    gzip_comp_level 3;            # Nivel bajo para ahorrar CPU
    gzip_min_length 1000;         # Solo archivos > 1KB
    gzip_proxied any;             # Comprimir respuestas de proxy
    
    # Tipos que SÍ se comprimen (solo texto)
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Tipos que NUNCA comprimir (multimedia ya comprimido)
    # jpg, png, mp4, mp3, etc. - desperdiciarían CPU
    
    # ==============================================
    # BUFFERS OPTIMIZADOS PARA DIFERENTES CARGAS
    # ==============================================
    
    # Buffers para requests normales (API, HTML)
    client_body_buffer_size 16k;        # POST data en memoria
    client_header_buffer_size 1k;       # Headers pequeños
    large_client_header_buffers 4 8k;   # Headers grandes (cookies)
    
    # Buffers para multimedia (más grandes)
    output_buffers 2 32k;               # Buffer de salida por conexión
    postpone_output 1460;               # Esperar hasta MTU antes de enviar
    
    # ==============================================
    # TIMEOUTS BALANCEADOS
    # Diferentes según tipo de operación
    # ==============================================
    client_body_timeout 12s;            # Tiempo para recibir body
    client_header_timeout 12s;          # Tiempo para recibir headers
    keepalive_timeout 65s;              # Conexión keep-alive
    send_timeout 10s;                   # Tiempo para enviar respuesta
    
    # Keepalive optimizado para multimedia
    keepalive_requests 1000;            # Requests por conexión
    
    # ==============================================
    # CONFIGURACIÓN DE PROXY
    # Para comunicación con .NET backend
    # ==============================================
    proxy_buffering on;                 # Buffer respuestas del backend
    proxy_buffer_size 8k;               # Buffer para headers de respuesta
    proxy_buffers 16 8k;                # Buffers para body de respuesta
    proxy_busy_buffers_size 16k;        # Buffers ocupados máximo
    
    # Cache de conexiones al backend
    upstream backend {
        server 127.0.0.1:5000;
        keepalive 32;                   # Pool de conexiones persistentes
    }
    
    # ==============================================
    # CONFIGURACIÓN DE CACHE EN DISCO
    # Para archivos que se piden frecuentemente
    # ==============================================
    
    # Cache para archivos estáticos pequeños (CSS, JS)
    proxy_cache_path /tmp/nginx-cache-static 
        levels=1:2 
        keys_zone=static_cache:10m 
        max_size=100m 
        inactive=24h 
        use_temp_path=off;
    
    # Cache para archivos multimedia (imágenes pequeñas, thumbnails)
    proxy_cache_path /tmp/nginx-cache-media 
        levels=1:2 
        keys_zone=media_cache:50m 
        max_size=500m 
        inactive=7d 
        use_temp_path=off;
    
    # ==============================================
    # LOGGING OPTIMIZADO
    # Solo errores en producción para ahorrar I/O
    # ==============================================
    
    # Formato de log personalizado (menos verbose)
    log_format optimized '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" rt=$request_time';
    
    # En desarrollo: log completo. En producción: solo errores
    access_log /var/log/nginx/access.log optimized;
    error_log /var/log/nginx/error.log warn;          # Solo warnings y errores
    
    # ==============================================
    # LÍMITES DE RATE (ANTI-SPAM/DOS)
    # Protección básica sin consumir recursos
    # ==============================================
    
    # Zona para limite de requests por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
    
    # No limitar archivos estáticos (imágenes, videos)
    # Son públicos y pueden necesitar acceso frecuente
    
    # ==============================================
    # INCLUIR CONFIGURACIONES DE SITIOS
    # ==============================================
    include /etc/nginx/sites-enabled/*;
}