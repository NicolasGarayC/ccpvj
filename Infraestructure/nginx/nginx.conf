# Configuración global optimizada para multimedia
worker_processes auto;
worker_cpu_affinity auto;

events {
    worker_connections 1024;
    use epoll;                    # Linux: más eficiente que select
    multi_accept on;              # Acepta múltiples conexiones por evento
}

http {
    # ==============================================
    # OPTIMIZACIONES DE RENDIMIENTO
    # ==============================================
    
    # Compresión inteligente (no comprimir multimedia)
    gzip on;
    gzip_vary on;
    gzip_comp_level 3;            # Bajo para ahorrar CPU
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        text/xml;
    # NO comprimir: imágenes, videos, audio (ya están comprimidos)
    
    # Cache de archivos del sistema
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 90s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Buffers optimizados para multimedia
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Timeouts balanceados
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;
    
    # Incluir configuraciones de sitios
    include /etc/nginx/sites-enabled/*;
}