<!DOCTYPE html>
<html>
<head>
    <title>Test Browser Crypto</title>
</head>
<body>
    <h1>Testing Browser Crypto</h1>
    <div id="result"></div>

    <script>
        const ENCRYPTION_KEY = 'CENTRO_CULTURAL_PVJ_2024';

        function simpleDecrypt(encryptedText) {
            try {
                // Decodificar de Base64
                const decoded = atob(encryptedText);
                let result = '';

                // Aplicar XOR inverso
                for (let i = 0; i < decoded.length; i++) {
                    const charCode = decoded.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length);
                    result += String.fromCharCode(charCode);
                }

                return result;
            } catch (error) {
                console.error('Error decrypting:', error);
                try {
                    return atob(encryptedText); // Fallback a base64 simple
                } catch {
                    return encryptedText; // Si todo falla, devolver texto original
                }
            }
        }

        const payload = "OGc9ITEsOjAmbm4hIDQpc3IyKytTEghPYTA9MSBtZTh3JTB3aGN9fXx0PyxXQlxVLiBsbnAuOy48InZ5cC8jMjIkL30IEnNQLiwgPSE7LSIxIyZ3fmMtLzU6JjZWXxAOYRYnJyYqMiJ3YHYnPS0pfWp0KztfWVxdMDE8NTYgLWEoMSk=";

        console.log('Original payload:', payload);
        const decrypted = simpleDecrypt(payload);
        console.log('Decrypted:', decrypted);

        document.getElementById('result').innerHTML = `
            <p><strong>Payload:</strong> ${payload}</p>
            <p><strong>Decrypted:</strong> ${decrypted}</p>
        `;

        if (decrypted) {
            try {
                const parsed = JSON.parse(decrypted);
                console.log('Parsed JSON:', parsed);
                document.getElementById('result').innerHTML += `
                    <p><strong>Parsed JSON:</strong> ${JSON.stringify(parsed, null, 2)}</p>
                `;
            } catch (e) {
                console.log('Failed to parse as JSON:', e.message);
                document.getElementById('result').innerHTML += `
                    <p><strong>JSON Parse Error:</strong> ${e.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
